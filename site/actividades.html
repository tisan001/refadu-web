<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actividades · ReFADU</title>
    <meta name="description" content="Charlas, talleres y juntadas de ReFADU: fecha, lugar e inscripción." />
    <meta name="theme-color" content="#FF6E23" />
    <link rel="icon" href="/assets/logos/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/refadu.css" />
    <link rel="stylesheet" href="/css/secciones.css" />
  </head>
  <body data-pagina="actividades">
    <!--#cabecera-->
    <main id="contenido">
      <section class="portada sobre-oscuro con-grano">
        <div class="contenedor portada-fila">
          <div class="portada-titulo">
            <h1 class="caja">Actividades</h1>
            <p class="bajada">Charlas, talleres y juntadas. Fijate la fecha y el lugar, y anotate si hace falta.</p>
          </div>
          <img class="portada-ilus" src="/assets/ilustraciones/ilus-7.webp" alt="" width="260" height="260" />
        </div>
      </section>
      <div class="franja zigzag" aria-hidden="true"></div>

      <section class="seccion" aria-labelledby="titulo-proximas">
        <div class="contenedor">
          <h2 class="bloque-titulo" id="titulo-proximas"><span class="estrella" aria-hidden="true"></span>Próximas</h2>
          <div class="grilla" id="proximas"></div>
        </div>
      </section>
      <section class="seccion" aria-labelledby="titulo-pasadas" id="bloque-pasadas" hidden>
        <div class="contenedor">
          <h2 class="bloque-titulo" id="titulo-pasadas"><span class="estrella" aria-hidden="true"></span>Ya pasaron</h2>
          <div class="grilla" id="pasadas"></div>
        </div>
      </section>
    </main>
    <!--#pie-->
    <script src="/js/actividades-tarjeta.js" defer></script>
    <script src="/js/actividades.js" defer></script>
  </body>
</html>
