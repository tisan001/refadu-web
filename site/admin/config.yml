# Editor de contenido de ReFADU (Decap CMS): https://decapcms.org/docs/
# Edita los archivos de content/ con formularios y guarda cada cambio como un commit en GitHub.
# Cloudflare Pages (o Netlify) publica solo cada commit, en uno o dos minutos.

backend:
  name: github
  repo: tisan001/refadu-web
  branch: main
  # Login con GitHub: ver "Editor de contenido" en el README.
  # el Worker de login (login-editor/)
  base_url: https://refadu-login.sanrt2001.workers.dev
  commit_messages:
    update: "Actualizar {{collection}} desde el editor"

# En tu compu: con `npm run editor` el editor guarda directo en content/, sin GitHub.
local_backend: true

locale: es
site_url: /
logo_url: /assets/logos/refadu-horizontal-color.svg

# Hace falta aunque por ahora no se suban imágenes desde el editor.
media_folder: assets/subidas
public_folder: /assets/subidas

collections:
  - name: contenido
    label: Contenido del sitio
    editor:
      preview: false
    files:
      # ------------------------------------------------------------ actividades
      - name: actividades
        label: Actividades
        file: content/actividades.json
        format: json
        description: Las tarjetas de la página Actividades. Las que ya pasaron se muestran solas al final, como "ya pasó".
        fields:
          - { name: _ayuda, widget: hidden, default: "Una tarjeta por actividad. 'fecha' va como AAAA-MM-DD. Si dura varios días, 'fecha' es el primero y 'fechaFin' el último (por ejemplo del 2026-11-11 al 2026-11-15). 'hora', 'fechaFin' e 'inscripcion' son opcionales. Las que ya pasaron se muestran al final como 'ya pasó'." }
          - name: actividades
            label: Actividades
            label_singular: actividad
            widget: list
            summary: "{{fields.fecha}} · {{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: fecha, label: "Fecha (o primer día)", widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false, picker_utc: true }
              - { name: fechaFin, label: "Hasta (opcional: si dura varios días)", widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false, picker_utc: true, required: false, hint: "Por ejemplo, del 11/11 al 15/11: en Fecha va el 11 y acá el 15. Si es un solo día, dejalo vacío." }
              - { name: hora, label: "Hora (por ejemplo 18:00)", widget: string, required: false, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Escribila como 18:00"] }
              - { name: lugar, label: Lugar, widget: string, required: false }
              - { name: descripcion, label: Descripción, widget: text, required: false }
              - { name: inscripcion, label: "Link de inscripción (opcional)", widget: string, required: false, pattern: ['^https?://', "Tiene que empezar con https://"] }

      # ------------------------------------------------------------ calendario
      - name: calendario
        label: Calendario académico
        file: content/calendario.json
        format: json
        description: El Google Calendar que se muestra en la página y las fechas clave de abajo.
        fields:
          - { name: _ayuda, widget: hidden, default: "Pegá en 'calendarioId' el ID del Google Calendar público (Configuración del calendario → Integrar el calendario → ID del calendario; suele terminar en @group.calendar.google.com). El calendario tiene que ser público. Mientras diga EJEMPLO, la página muestra un aviso en lugar del calendario. Cada fecha clave tiene 'fecha' y, si dura varios días, 'fechaFin' (el último día)." }
          - { name: calendarioId, label: "ID del Google Calendar", widget: string, hint: "En Google Calendar: Configuración del calendario → Integrar el calendario → ID del calendario. El calendario tiene que ser público." }
          - { name: zonaHoraria, widget: hidden, default: America/Argentina/Buenos_Aires }
          - name: fechasClave
            label: Fechas clave
            label_singular: fecha
            widget: list
            summary: "{{fields.fecha}} · {{fields.texto}}"
            fields:
              - { name: fecha, label: "Fecha (o primer día)", widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false, picker_utc: true }
              - { name: fechaFin, label: "Hasta (opcional: si dura varios días)", widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false, picker_utc: true, required: false, hint: "Por ejemplo, del 11/11 al 15/11: en Fecha va el 11 y acá el 15. Si es un solo día, dejalo vacío." }
              - { name: texto, label: "Qué pasa (por ejemplo: Inscripción a finales)", widget: string }

      # ------------------------------------------------------------ grupos
      - name: grupos
        label: Grupos de WhatsApp
        file: content/grupos.json
        format: json
        description: "Los grupos de la página Grupos. Para cargar muchos de una desde un Excel, abrí /admin/importar.html (con la misma sesión)."
        fields:
          - { name: _ayuda, widget: hidden, default: "Un renglón por grupo. 'tipo' puede ser: carrera, cbc, año o materia. 'carrera' es el id de content/carreras.json (en los de CBC dejalo vacío). En los de CBC poné en 'anio' de qué año es el grupo (por ejemplo 2026). Los links empiezan con https://chat.whatsapp.com/." }
          - name: grupos
            label: Grupos
            label_singular: grupo
            widget: list
            summary: "{{fields.tipo}} · {{fields.nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: descripcion, label: Descripción corta, widget: string }
              - name: tipo
                label: Tipo
                widget: select
                options:
                  - { label: General de la carrera, value: carrera }
                  - { label: CBC, value: cbc }
                  - { label: Por año, value: año }
                  - { label: Por materia, value: materia }
              - { name: anio, label: "Año del CBC (solo grupos de CBC)", widget: number, value_type: int, required: false, min: 2020, max: 2100, hint: "De qué año es el grupo de CBC, por ejemplo 2026. Es obligatorio en los de CBC." }
              - { name: materia, label: "Materia (solo grupos por materia)", widget: string, required: false, hint: "Por ejemplo: Morfología 1. Es obligatoria en los grupos por materia." }
              - name: anioCursada
                label: "Año de la carrera (solo grupos por año)"
                widget: select
                required: false
                hint: Es obligatorio en los grupos por año.
                options:
                  - { label: "1º año", value: 1 }
                  - { label: "2º año", value: 2 }
                  - { label: "3º año", value: 3 }
                  - { label: "4º año", value: 4 }
                  - { label: "5º año", value: 5 }
                  - { label: "6º año", value: 6 }
              - name: carrera
                label: Carrera
                widget: select
                required: false
                hint: En los grupos de CBC dejalo vacío.
                options:
                  - { label: "(ninguna: CBC)", value: "" }
                  - { label: Arquitectura, value: arquitectura }
                  - { label: Diseño Gráfico, value: grafico }
                  - { label: Diseño Industrial, value: industrial }
                  - { label: Diseño de Indumentaria, value: indumentaria }
                  - { label: Diseño Textil, value: textil }
                  - { label: Diseño de Imagen y Sonido, value: imagen-y-sonido }
                  - { label: Paisaje, value: paisaje }
              - { name: link, label: Link de invitación, widget: string, pattern: ['^https://chat\.whatsapp\.com/', "Tiene que ser un link https://chat.whatsapp.com/..."] }

      # ------------------------------------------------------------ apuntes
      - name: apuntes
        label: Banco de apuntes
        file: content/apuntes.json
        format: json
        description: El formulario para subir material y, por carrera, la carpeta general de Drive y una carpeta por materia.
        fields:
          - { name: _ayuda, widget: hidden, default: "'formularioSubir' es el formulario para que la gente mande material. En cada carrera, 'drive' es la carpeta general y 'materias' tiene una carpeta por materia." }
          - { name: formularioSubir, label: "Formulario para subir material", widget: string, pattern: ['^https?://', "Tiene que empezar con https://"] }
          - name: carreras
            label: Carreras
            label_singular: carrera
            widget: list
            summary: "{{fields.carrera}}"
            fields:
              - name: carrera
                label: Carrera
                widget: select
                options: &carreras
                  - { label: Arquitectura, value: arquitectura }
                  - { label: Diseño Gráfico, value: grafico }
                  - { label: Diseño Industrial, value: industrial }
                  - { label: Diseño de Indumentaria, value: indumentaria }
                  - { label: Diseño Textil, value: textil }
                  - { label: Diseño de Imagen y Sonido, value: imagen-y-sonido }
                  - { label: Paisaje, value: paisaje }
              - { name: drive, label: "Carpeta general de Drive", widget: string, pattern: ['^https?://', "Tiene que empezar con https://"] }
              - name: materias
                label: Materias
                label_singular: materia
                widget: list
                summary: "{{fields.nombre}}"
                fields:
                  - { name: nombre, label: Materia, widget: string }
                  - { name: link, label: "Carpeta de Drive de la materia", widget: string, pattern: ['^https?://', "Tiene que empezar con https://"] }

      # ------------------------------------------------------------ becas
      - name: becas
        label: Becas
        file: content/becas.json
        format: json
        description: Las tarjetas de la página Becas. Sin fecha límite, se muestra como "Todo el año".
        fields:
          - { name: _ayuda, widget: hidden, default: "Una tarjeta por beca. 'fechaLimite' va como AAAA-MM-DD (dejala vacía si es todo el año). 'requisitos' es una lista de textos cortos." }
          - name: becas
            label: Becas
            label_singular: beca
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: organismo, label: "Quién la da", widget: string, required: false }
              - { name: descripcion, label: Descripción, widget: text, required: false }
              - name: requisitos
                label: Requisitos
                label_singular: requisito
                widget: list
                required: false
                field: { name: requisito, label: Requisito, widget: string }
              - { name: fechaLimite, label: "Fecha límite (vacía si es todo el año)", widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false, picker_utc: true, required: false }
              - { name: link, label: "Link para anotarse", widget: string, pattern: ['^https?://', "Tiene que empezar con https://"] }

      # ------------------------------------------------------------ recomendaciones
      - name: recomendaciones
        label: Recomendaciones
        file: content/recomendaciones.json
        format: json
        description: El cuatrimestre de las recomendaciones y, por carrera, el formulario y el link a las recomendaciones. Sin link, la página muestra "Próximamente".
        fields:
          - { name: _ayuda, widget: hidden, default: "Arriba va el cuatrimestre de las recomendaciones (se muestra en todas las carreras). En cada carrera: 'formulario' es el link 'Para compartir' del Google Form (termina en /viewform) y 'recomendaciones' es el link al PDF o carpeta con las recomendaciones de ese cuatrimestre. Mientras se juntan las respuestas, dejá 'recomendaciones' vacío: la página muestra 'Próximamente'." }
          - { name: cuatrimestreActual, label: "Cuatrimestre (por ejemplo: 2do cuatrimestre 2026)", widget: string }
          - name: carreras
            label: Carreras
            label_singular: carrera
            widget: list
            allow_add: false
            summary: "{{fields.nombre}}"
            fields:
              - { name: carrera, label: Carrera, widget: select, options: *carreras }
              - { name: nombre, label: "Nombre que se muestra", widget: string }
              - { name: formulario, label: "Formulario (link 'Para compartir', termina en /viewform)", widget: string, pattern: ['^https://docs\.google\.com/forms/', "Tiene que ser un link de Google Forms"] }
              - { name: recomendaciones, label: "Link a las recomendaciones (vacío = Próximamente)", widget: string, required: false }
